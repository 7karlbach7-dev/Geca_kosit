<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zvoz odpadu - Geča 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #212121;
      --text-sub: #666666;
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px 0;
      color: var(--primary-dark);
    }
    p.subtitle {
      margin: 0;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
    }
    .action-btn:active {
      background-color: var(--primary-dark);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #fafafa;
      border-left: 6px solid #ccc;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card.past {
      opacity: 0.45;
      background: #f0f0f0;
    }
    .card.ko { border-left-color: #333333; }      /* Komunálny odpad */
    .card.plasty { border-left-color: #fbc02d; }  /* Plasty, Kovy, VKM */
    .card.papier { border-left-color: #1976d2; }  /* Papier */
    .card.sklo { border-left-color: #388e3c; }    /* Sklo */

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .card-type {
      font-weight: bold;
      font-size: 1rem;
    }
    .card-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: capitalize;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: #e0e0e0;
      color: #555;
    }
    .card.past .badge {
      background: #dcdcdc;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🗑️ Zvoz odpadu Geča</h1>
    <p class="subtitle">Harmonogram 2026 (KOSIT)</p>
  </header>

  <button class="action-btn" onclick="exportToICS()">
    📅 Pridať celý rok 2026 do Kalendára
  </button>

  <div class="card-list" id="schedule">
    <!-- Generuje sa dynamicky -->
  </div>
</div>

<script>
  // Celoročný harmonogram zvozov pre obec Geča na rok 2026
  const harmonogramGeca = [
    // Január 2026
    { type: "Komunálny odpad", date: "2026-01-07", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-01-14", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-01-21", class: "ko" },
    { type: "Papier", date: "2026-01-28", class: "papier" },
    
    // Február 2026
    { type: "Komunálny odpad", date: "2026-02-04", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-02-11", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-02-18", class: "ko" },
    { type: "Sklo", date: "2026-02-25", class: "sklo" },

    // Marec 2026
    { type: "Komunálny odpad", date: "2026-03-04", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-03-11", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-03-18", class: "ko" },
    { type: "Papier", date: "2026-03-25", class: "papier" },

    // Apríl 2026
    { type: "Komunálny odpad", date: "2026-04-01", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-04-08", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-04-15", class: "ko" },
    { type: "Sklo", date: "2026-04-22", class: "sklo" },
    { type: "Komunálny odpad", date: "2026-04-29", class: "ko" },

    // Máj 2026
    { type: "Plasty, Kovy & VKM", date: "2026-05-06", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-05-13", class: "ko" },
    { type: "Papier", date: "2026-05-20", class: "papier" },
    { type: "Komunálny odpad", date: "2026-05-27", class: "ko" },

    // Jún 2026
    { type: "Plasty, Kovy & VKM", date: "2026-06-03", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-06-10", class: "ko" },
    { type: "Sklo", date: "2026-06-17", class: "sklo" },
    { type: "Komunálny odpad", date: "2026-06-24", class: "ko" },

    // Júl 2026
    { type: "Plasty, Kovy & VKM", date: "2026-07-01", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-07-08", class: "ko" },
    { type: "Papier", date: "2026-07-15", class: "papier" },
    { type: "Komunálny odpad", date: "2026-07-22", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-07-29", class: "plasty" },

    // August 2026
    { type: "Komunálny odpad", date: "2026-08-05", class: "ko" },
    { type: "Sklo", date: "2026-08-12", class: "sklo" },
    { type: "Komunálny odpad", date: "2026-08-19", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-08-26", class: "plasty" },

    // September 2026
    { type: "Komunálny odpad", date: "2026-09-02", class: "ko" },
    { type: "Papier", date: "2026-09-09", class: "papier" },
    { type: "Komunálny odpad", date: "2026-09-16", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-09-23", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-09-30", class: "ko" },

    // Október 2026
    { type: "Sklo", date: "2026-10-07", class: "sklo" },
    { type: "Komunálny odpad", date: "2026-10-14", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-10-21", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-10-28", class: "ko" },

    // November 2026
    { type: "Papier", date: "2026-11-04", class: "papier" },
    { type: "Komunálny odpad", date: "2026-11-11", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-11-18", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-11-25", class: "ko" },

    // December 2026
    { type: "Sklo", date: "2026-12-02", class: "sklo" },
    { type: "Komunálny odpad", date: "2026-12-09", class: "ko" },
    { type: "Plasty, Kovy & VKM", date: "2026-12-16", class: "plasty" },
    { type: "Komunálny odpad", date: "2026-12-23", class: "ko" },
    { type: "Komunálny odpad", date: "2026-12-30", class: "ko" }
  ];

  // Zoradenie chronologicky
  harmonogramGeca.sort((a, b) => new Date(a.date) - new Date(b.date));

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const scheduleContainer = document.getElementById('schedule');

  harmonogramGeca.forEach(item => {
    const itemDate = new Date(item.date);
    const isPast = itemDate < today;

    const options = { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' };
    const dateFormatted = itemDate.toLocaleDateString('sk-SK', options);

    const card = document.createElement('div');
    card.className = `card ${item.class} ${isPast ? 'past' : ''}`;
    card.innerHTML = `
      <div class="card-info">
        <div class="card-type">${item.type}</div>
        <div class="card-date">${dateFormatted}</div>
      </div>
      <div class="badge">${isPast ? 'Prebehlo' : 'Budúci zvoz'}</div>
    `;
    scheduleContainer.appendChild(card);
  });

  function exportToICS() {
    let icsData = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Zvoz Odpadu Geca 2026//SK",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH"
    ];

    harmonogramGeca.forEach((item, idx) => {
      const cleanDate = item.date.replace(/-/g, "");
      icsData.push(
        "BEGIN:VEVENT",
        `UID:geca-zvoz-2026-${cleanDate}-${idx}@geca.sk`,
        `DTSTART;VALUE=DATE:${cleanDate}`,
        `SUMMARY:🗑️ Odvoz: ${item.type}`,
        `DESCRIPTION:Zvoz odpadu v obci Geča - ${item.type}.`,
        "LOCATION:Geča",
        "BEGIN:VALARM",
        "ACTION:DISPLAY",
        "DESCRIPTION:Pripomienka odvozu odpadu",
        "TRIGGER:-PT12H",
        "END:VALARM",
        "END:VEVENT"
      );
    });

    icsData.push("END:VCALENDAR");

    const blob = new Blob([icsData.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    const link = document.createElement("a");
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute("download", "Zvoz_Odpadu_Geca_2026.ics");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>

</body>
</html>
